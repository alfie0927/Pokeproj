<!doctype html>
<html>
<head><meta charset="utf-8"></head>
<body>
<script>
// Invisible helper: Streamlit's uploader drops each file's lastModified (when the photo was saved on the phone /
// computer). Listen on the app page for files picked or dropped and report {"name|size": lastModified}.
const send = (type, data) => window.parent.postMessage(Object.assign({ isStreamlitMessage: true, type }, data), "*");
const seen = {};

function record(files) {
  if (!files || !files.length) return;
  for (const f of files) seen[`${f.name}|${f.size}`] = f.lastModified;
  send("streamlit:setComponentValue", { value: Object.assign({}, seen), dataType: "json" });
}
const onChange = e => { if (e.target && e.target.type === "file") record(e.target.files); };
const onDrop = e => record(e.dataTransfer && e.dataTransfer.files);
const doc = window.parent.document;
doc.addEventListener("change", onChange, true);
doc.addEventListener("drop", onDrop, true);
window.addEventListener("pagehide", () => {
  doc.removeEventListener("change", onChange, true);
  doc.removeEventListener("drop", onDrop, true);
});
window.addEventListener("message", e => {
  if (e.data && e.data.type === "streamlit:render") send("streamlit:setFrameHeight", { height: 0 });
});
send("streamlit:componentReady", { apiVersion: 1 });
</script>
</body>
</html>
