# Pull-rate ESTIMATES per booster pack, by era, keyed on TCGdex rarity names. Pokémon publishes no odds; these are
# rough community tallies. Override any set under [sets."<tcgdex id>"] (same keys). Edit freely — the Sealed EV
# refresh reads this file every time.
#
# A value is the expected number of cards of that rarity per pack (so "Rare" = 1.0 means one rare slot per pack).
# extra_sets: sub-sets pulled from the same packs (Galarian Gallery, Shiny Vault…), with their own rates.

[eras.xy]
bulk_per_pack = 0.10
[eras.xy.rates]
"Rare" = 1.0
"Ultra Rare" = 0.11
"Secret Rare" = 0.02

