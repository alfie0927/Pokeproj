# Pull-rate ESTIMATES per booster pack, by era, keyed on TCGdex rarity names. Pokémon publishes no odds. The numbers
# below come from the largest public tallies (mostly TCGplayer's, 1,200-8,000+ packs per set, as reported by
# PokeBeach / Card Codex / Elite Fourum), rounded; where no tally exists the line says "rough". Override any set
# under [sets."<tcgdex id>"] (same keys). Edit freely: the Sealed EV refresh reads this file every time.
#
# A value is the expected number of cards of that rarity per pack ("1 in 20 packs" = 0.05). "Rare" is the plain rare
# slot: 1 minus the hits that replace it (ex / V / full arts / golds). Illustration rares, shinies, ACE SPECs and
# gallery cards replace the reverse-holo slot, so they add on top.
# extra_sets: sub-sets pulled from the same packs (Galarian Gallery, Shiny Vault, Trainer Gallery…), own rates.
# Last checked: Nov 2026.

[eras.xy]                       # 2014-16. Elite Fourum sheet model: ~4.4 EX + 2.4 full arts + 1 secret per 36 packs
bulk_per_pack = 0.10
[eras.xy.rates]
"Rare" = 0.79
"Ultra Rare" = 0.19             # EX / Mega / full art, ~1 in 5
"Secret Rare" = 0.025           # ~1 in 40

