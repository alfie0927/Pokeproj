# Sealed EV data. One [[set]] per set; one [[set.products]] per product.
#   id      = TCGdex set id (https://api.tcgdex.net/v2/en/sets  or  /v2/ja/sets)
#   rates   = chance per pack of pulling that rarity. Keys must match TCGdex rarity strings exactly
#             (en: "Double rare", "Illustration rare", "Ultra Rare", "Special illustration rare", "Hyper rare",
#              "ACE SPEC Rare"; ja SV2a: "Mega Hyper Rare" for the gold URs).
#   bulk_per_pack = £ value you assign to everything else in a pack (commons, reverses...).
#   products.price = 0 -> use the eBay sold median for ebay_query; set a number to use your own buy price.
#   promos  = TCGdex card ids of promo cards included in the product.
#
# !! The rates below are ROUGH community estimates (pack-opening tallies) — check them against a current
# !! pull-rate source before trusting the EV ranking. Pokémon doesn't publish official odds.

[[set]]
id = "sv03.5"
lang = "en"
name = "151"
bulk_per_pack = 0.15
rates = { "Double rare" = 0.20, "Illustration rare" = 0.083, "Ultra Rare" = 0.063, "Special illustration rare" = 0.031, "Hyper rare" = 0.019 }

  [[set.products]]
  name = "Booster Bundle"
  packs = 6
  promos = []
  price = 0
  ebay_query = '"151" "booster bundle" sealed -opened -empty -japanese -case -x2 -x3'

  [[set.products]]
  name = "Elite Trainer Box"
  packs = 9
  promos = []
  price = 0
  ebay_query = '"151" "elite trainer box" sealed -opened -empty -japanese -"pokemon center" -centre -center -"silver tempest" -"astral radiance" -case'

